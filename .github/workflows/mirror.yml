name: Mirror CHDK SVN to master

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - sync
    paths:
      - '.github/workflows/mirror.yml'

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Install git-svn and dependencies
        run: |
          sudo add-apt-repository ppa:git-core/ppa -y
          sudo apt-get update
          sudo apt-get install -y git-svn subversion

      - name: Initialize empty git repo and add remote
        run: |
          git init
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/petabyt/chdk.git
          git fetch origin master || true
          git checkout master || git checkout -b master

      - name: Cache git-svn metadata
        uses: actions/cache@v4
        with:
          path: .git/svn
          key: svn-mirror-cache

      - name: Configure git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@users.noreply.github.com"

      - name: Initialize SVN if needed
        run: |
          if [ ! -d .git/svn ]; then
            git svn init --stdlayout https://subversion.assembla.com/svn/chdk
          fi

      - name: Rebase from SVN
        run: printf "password\n" | git svn rebase

      - name: Push changes to master
        run: git push origin HEAD:master
